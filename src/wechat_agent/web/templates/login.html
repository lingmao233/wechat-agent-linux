<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>登录 · 微信 Agent</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="auth-page"><main class="auth-card"><div class="brand-symbol"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 13.5C5 9.1 8.2 6 12.5 6 16.2 6 19 8.4 19 11.8c0 3.9-3.4 6.2-7.2 6.2-1.2 0-2.3-.2-3.2-.7L5 20l.8-3.4c-.5-.9-.8-2-.8-3.1Z"/></svg></div><h1>需要访问口令</h1><p>输入 DESKTOP_TOKEN。验证后会在本机保存 HttpOnly Cookie，刷新和深链接无需重复输入。</p>{% if error %}<div class="notice error"><span>{{ error }}</span></div>{% endif %}<form method="get" action=""><label class="compact-field"><span>访问口令</span><input type="password" name="token" autofocus autocomplete="current-password" required></label><button class="btn" type="submit">进入控制台</button></form><p class="muted">也可使用 Authorization: Bearer 请求头。</p></main></body></html>
